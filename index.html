<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer de Equipe</title>
    <!-- Favicon dinâmico inicial -->
    <link id="favicon" rel="icon" type="image/png" href="">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --border-color: #27272a;
            --primary-color: #10b981;
            --primary-hover: #059669;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --accent-color: #3b82f6;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            text-align: center;
            max-width: 480px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--border-color);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            transition: width 0.3s ease;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background-color: #27272a;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #71717a;
        }

        .status-dot.active {
            background-color: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
        }

        .status-dot.ended {
            background-color: var(--danger-color);
        }

        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin: 15px 0 25px;
        }

        .input-group {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px 12px;
            margin-bottom: 28px;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px 4px;
            font-size: 1.25rem;
            font-weight: 600;
            width: 60px;
            text-align: center;
            outline: none;
        }

        .input-group input::-webkit-outer-spin-button,
        .input-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-group span {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .btn-pause {
            background-color: #27272a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-pause:hover {
            background-color: var(--danger-color);
            color: #fff;
            border-color: var(--danger-color);
        }

        .btn-share {
            width: 100%;
            background-color: transparent;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            padding: 12px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-share:hover {
            background-color: #27272a;
            color: var(--text-main);
        }
    </style>

    <!-- Canvas oculto para desenhar o favicon -->
    <canvas id="favicon-canvas" width="64" height="64" style="display:none;"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvxKWshIHghAk2CQG7cbE3HrRbM_UySaQ",
            authDomain: "relogio-49208.firebaseapp.com",
            databaseURL: "https://relogio-49208-default-rtdb.firebaseio.com",
            projectId: "relogio-49208",
            storageBucket: "relogio-49208.firebasestorage.app",
            messagingSenderId: "411756038196",
            appId: "1:411756038196:web:3e0b4be9f2ede38421a261",
            measurementId: "G-DF58LYTJQE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const timerRef = ref(db, 'shared_timer');

        let intervalId = null;
        let targetTimestamp = null;
        let totalDurationSeconds = 0;

        const display = document.getElementById('display');
        const minutesInput = document.getElementById('minutes-input');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');
        
        // Elementos do Favicon Dinâmico
        const canvas = document.getElementById('favicon-canvas');
        const ctx = canvas.getContext('2d');
        const faviconLink = document.getElementById('favicon');

        // Função que desenha o círculo tipo Cukoo no favicon
        function updateFaviconProgress(percent) {
            ctx.clearRect(0, 0, 64, 64);

            // Círculo de fundo (cinza escuro)
            ctx.beginPath();
            ctx.arc(32, 32, 26, 0, 2 * Math.PI);
            ctx.fillStyle = '#27272a';
            ctx.fill();

            // Círculo de progresso (verde)
            const startAngle = -0.5 * Math.PI; // Começa no topo (12h)
            const endAngle = startAngle + (2 * Math.PI * (percent / 100));

            ctx.beginPath();
            ctx.moveTo(32, 32);
            ctx.arc(32, 32, 26, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = percent >= 100 ? '#ef4444' : '#10b981';
            ctx.fill();

            // Atualiza a imagem da aba
            faviconLink.href = canvas.toDataURL('image/png');
        }

        onValue(timerRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.target) {
                targetTimestamp = data.target;
                totalDurationSeconds = data.totalSeconds || (parseInt(minutesInput.value) * 60);
                
                statusDot.className = "status-dot active";
                statusText.innerText = "Em andamento";
                startCountdown();
            } else {
                clearInterval(intervalId);
                const mins = parseInt(minutesInput.value) || 20;
                updateDisplay(mins * 60);
                
                statusDot.className = "status-dot";
                statusText.innerText = "Pausado";
                progressBar.style.width = "0%";
                updateFaviconProgress(0);
            }
        });

        function startCountdown() {
            clearInterval(intervalId);
            intervalId = setInterval(() => {
                const now = Date.now();
                const difference = targetTimestamp - now;

                if (difference <= 0) {
                    clearInterval(intervalId);
                    updateDisplay(0);
                    statusDot.className = "status-dot ended";
                    statusText.innerText = "Tempo esgotado";
                    progressBar.style.width = "100%";
                    updateFaviconProgress(100);
                    return;
                }

                const secondsLeft = Math.floor(difference / 1000);
                updateDisplay(secondsLeft);

                if (totalDurationSeconds > 0) {
                    const elapsed = totalDurationSeconds - secondsLeft;
                    const percent = Math.min(100, Math.max(0, (elapsed / totalDurationSeconds) * 100));
                    
                    progressBar.style.width = `${percent}%`;
                    updateFaviconProgress(percent); // Atualiza o favicon
                }
            }, 1000);
        }

        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            const timeString = `${m}:${s}`;
            
            display.innerText = timeString;
            document.title = `(${timeString}) Timer`;
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            const mins = parseInt(minutesInput.value) || 20;
            const durationMs = mins * 60 * 1000;
            const newTarget = Date.now() + durationMs;
            
            set(timerRef, { 
                target: newTarget,
                totalSeconds: mins * 60
            });
        });

        document.getElementById('pause-btn').addEventListener('click', () => {
            set(timerRef, { target: null, totalSeconds: 0 });
        });

        document.getElementById('share-btn').addEventListener('click', () => {
            const cleanUrl = window.location.origin + window.location.pathname;
            navigator.clipboard.writeText(cleanUrl);
            alert("Link copiado!");
        });

        // Desenha o favicon neutro assim que carrega
        updateFaviconProgress(0);
    </script>
</head>
<body>

<div class="container">
    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="header">
        <h1>⏱️ Timer de Equipe</h1>
        <div class="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Pronto</span>
        </div>
    </div>

    <div class="timer-display" id="display">20:00</div>

    <div class="input-group">
        <input type="number" id="minutes-input" value="20" min="1" max="999">
        <span>minutos</span>
    </div>

    <div class="controls-grid">
        <button class="btn" id="start-btn">Iniciar</button>
        <button class="btn btn-pause" id="pause-btn">Zerar</button>
    </div>

    <button class="btn btn-share" id="share-btn">Copiar Link da Sala</button>
</div>

</body>
</html>
