<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer de Equipe Sincronizado</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #202024;
            --primary-color: #00b37e;
            --text-color: #e1e1e6;
            --text-sub: #8d8d99;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-color);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--text-sub); }
        .timer-display {
            font-size: 5.5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
        }
        .controls input {
            background: #121214;
            border: 2px solid #29292e;
            color: #fff;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 6px;
            width: 80px;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        .btn-pause { background-color: #f75a68; }
        .btn-share { background-color: #4863f7; }
    </style>

    <!-- Módulos do Firebase via CDN para rodar direto no navegador -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Sua configuração do Firebase inserida
        const firebaseConfig = {
            apiKey: "AIzaSyDvxKWshIHghAk2CQG7cbE3HrRbM_UySaQ",
            authDomain: "relogio-49208.firebaseapp.com",
            databaseURL: "https://relogio-49208-default-rtdb.firebaseio.com",
            projectId: "relogio-49208",
            storageBucket: "relogio-49208.firebasestorage.app",
            messagingSenderId: "411756038196",
            appId: "1:411756038196:web:3e0b4be9f2ede38421a261",
            measurementId: "G-DF58LYTJQE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const timerRef = ref(db, 'shared_timer');

        let intervalId = null;
        let targetTimestamp = null;

        const display = document.getElementById('display');
        const minutesInput = document.getElementById('minutes-input');

        // Escuta o banco do Firebase. Qualquer alteração atualiza as telas de toda a equipe
        onValue(timerRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.target) {
                targetTimestamp = data.target;
                startCountdown();
            } else {
                clearInterval(intervalId);
                const mins = parseInt(minutesInput.value) || 20;
                updateDisplay(mins * 60);
            }
        });

        function startCountdown() {
            clearInterval(intervalId);
            intervalId = setInterval(() => {
                const now = Date.now();
                const difference = targetTimestamp - now;

                if (difference <= 0) {
                    clearInterval(intervalId);
                    updateDisplay(0);
                    return;
                }

                const secondsLeft = Math.floor(difference / 1000);
                updateDisplay(secondsLeft);
            }, 1000);
        }

        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            const timeString = `${m}:${s}`;
            
            display.innerText = timeString;
            document.title = `(${timeString}) Timer`;
        }

        // Botão Iniciar: Envia o novo tempo para a nuvem
        document.getElementById('start-btn').addEventListener('click', () => {
            const mins = parseInt(minutesInput.value) || 20;
            const durationMs = mins * 60 * 1000;
            const newTarget = Date.now() + durationMs;
            
            set(timerRef, { target: newTarget });
        });

        // Botão Zerar: Reseta o tempo para todos na nuvem
        document.getElementById('pause-btn').addEventListener('click', () => {
            set(timerRef, { target: null });
        });

        // Botão Copiar Link: Copia a URL limpa (sem parâmetros)
        document.getElementById('share-btn').addEventListener('click', () => {
            const cleanUrl = window.location.origin + window.location.pathname;
            navigator.clipboard.writeText(cleanUrl);
            alert("Link copiado! Envie este link para sua equipe.");
        });
    </script>
</head>
<body>

<div class="container">
    <h1>⏱️ Cronômetro Compartilhado</h1>
    <div class="timer-display" id="display">20:00</div>

    <div class="controls">
        <input type="number" id="minutes-input" value="20" min="1">
        <span style="font-size:1.2rem">min</span>
        <br>
        <button class="btn" id="start-btn">Iniciar</button>
        <button class="btn btn-pause" id="pause-btn">Zerar</button>
        <button class="btn btn-share" id="share-btn">Copiar Link da Equipe</button>
    </div>
</div>

</body>
</html>
