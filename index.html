<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20:00 - Timer de Equipe</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #202024;
            --primary-color: #00b37e;
            --text-color: #e1e1e6;
            --text-sub: #8d8d99;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-color);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--text-sub); }
        .timer-display {
            font-size: 5.5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
        }
        .controls input {
            background: #121214;
            border: 2px solid #29292e;
            color: #fff;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 6px;
            width: 80px;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        .btn-pause { background-color: #f75a68; }
        .btn-share { background-color: #4863f7; }
    </style>
</head>
<body>

<div class="container">
    <h1>⏱️ Cronômetro Compartilhado</h1>
    <div class="timer-display" id="display">20:00</div>

    <div class="controls">
        <input type="number" id="minutes-input" value="20" min="1">
        <span style="font-size:1.2rem">min</span>
        <br>
        <button class="btn" id="start-btn">Iniciar</button>
        <button class="btn btn-pause" id="pause-btn">Zerar</button>
        <button class="btn btn-share" id="share-btn">Copiar Link da Equipe</button>
    </div>
</div>

<script>
    let intervalId = null;
    let targetTimestamp = null;

    const display = document.getElementById('display');
    const minutesInput = document.getElementById('minutes-input');

    // Verifica se já existe um timer rodando vindo pelo link compartilhado
    const urlParams = new URLSearchParams(window.location.search);
    const urlTarget = urlParams.get('end');

    if (urlTarget) {
        targetTimestamp = parseInt(urlTarget);
        startCountdown();
    }

    function startCountdown() {
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            const now = Date.now();
            const difference = targetTimestamp - now;

            if (difference <= 0) {
                clearInterval(intervalId);
                updateDisplay(0);
                alert("Tempo esgotado!");
                // Limpa o link da barra de endereço quando o tempo acaba
                window.history.replaceState({}, '', window.location.pathname);
                return;
            }

            const secondsLeft = Math.floor(difference / 1000);
            updateDisplay(secondsLeft);
        }, 1000);
    }

    function updateDisplay(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        const timeString = `${m}:${s}`;
        
        display.innerText = timeString;
        document.title = `(${timeString}) Timer`; // Atualiza a aba do navegador
    }

    // Botão Iniciar: Calcula o fim do tempo e joga no link do navegador
    document.getElementById('start-btn').addEventListener('click', () => {
        const mins = parseInt(minutesInput.value) || 20;
        const durationMs = mins * 60 * 1000;
        
        targetTimestamp = Date.now() + durationMs;
        
        // Atualiza a URL do navegador com o tempo final exato
        window.history.replaceState({}, '', `?end=${targetTimestamp}`);
        
        startCountdown();
    });

    // Botão Zerar: Limpa a tela e reseta o link do navegador
    document.getElementById('pause-btn').addEventListener('click', () => {
        clearInterval(intervalId);
        window.history.replaceState({}, '', window.location.pathname);
        const mins = parseInt(minutesInput.value) || 20;
        updateDisplay(mins * 60);
    });

    // Botão Copiar Link: Dá o link pronto para as outras 5 pessoas acessarem o mesmo tempo
    document.getElementById('share-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copiado! Envie para sua equipe e todos verão o mesmo tempo.");
    });
</script>

</body>
</html>
